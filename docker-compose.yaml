version: "3.8"

services:
  traefik:
    image: traefik:v3.7.1
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--ping=true"
    ports:
      - "80:80" # API Requests
      - "8080:8080" # Dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - public-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASS:-secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - data-net
      - rabbitmq-management-net
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  chat-gateway:
    build:
      context: ../Gateway
      dockerfile: Dockerfile
      args:
        - GITHUB_USER=${GITHUB_USER}
        - GITHUB_TOKEN=${GITHUB_TOKEN}
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - RabbitMQ__Host=rabbitmq
      - Redis__ConnectionString=redis:6379
      - Supabase__Url=${SUPABASE_URL}
      - ASPNETCORE_ENVIRONMENT=Development
      - RABBITMQ_HOST=rabbitmq
      - REDIS_HOST=redis
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=docker_public-net"
      # Traefik leitet alle API-, YARP- und WebSocket-Anfragen an das Gateway weiter.
      - "traefik.http.routers.chat-gateway.rule=PathPrefix(`/`)"
      - "traefik.http.routers.chat-gateway.entrypoints=web"
      - "traefik.http.routers.chat-gateway.service=chat-gateway"
      - "traefik.http.services.chat-gateway.loadbalancer.server.port=8080"
    networks:
      - public-net # Talk to Traefik
      - data-net # Talk to Redis and RabbitMQ
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  user-service:
    build:
      context: ../UserService
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Redis__ConnectionString=redis:6379
      - Supabase__Url=${SUPABASE_URL}
      - Supabase__PublishableKey=${SUPABASE_PUBLISHABLE_KEY}
      - Supabase__SecretKey=${SUPABASE_SECRET_KEY}
    networks:
      - public-net
      - data-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

