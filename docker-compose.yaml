version: '3.8'

services:
  database:
    image: postgres:18.4
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - data-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - data-net

  rabbitmq:
    image: rabbitmq:management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: "user"
      RABBITMQ_DEFAULT_PASS: "pass"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - data-net
      - public-net
    ports:
      - "15672:15672"

  # chat-gateway: get from doku

  # auth-service: get from doku

  # user-directory: get from doku

  # storage-worker: get from doku

   # delivery-worker: get from doku

networks:
  public-net:
    driver: bridge
  internal-net:
    driver: bridge
    internal: true
  data-net:
    driver: bridge
    internal: true

volumes:
  db_data:
  redis_data:
  rabbitmq_data: