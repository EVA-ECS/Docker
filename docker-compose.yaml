networks:
  public-net:
    name: docker_public-net
    driver: bridge
  internal-net:
    driver: bridge
    internal: true
  data-net:
    name: docker_data-net
    driver: bridge
    internal: true
  rabbitmq-management-net:
    driver: bridge

volumes:
  redis_data:
  rabbitmq_data:
