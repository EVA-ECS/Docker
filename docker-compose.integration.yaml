name: eva-integration

services:
  traefik:
    image: traefik:v3.7.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.constraints=Label(`com.docker.compose.project`, `${COMPOSE_PROJECT_NAME:-eva-integration}`)
      - --entrypoints.eva-isolated.address=:80
      - --ping=true
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-18080}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [public-net]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  rabbitmq:
    image: rabbitmq:management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASS:?Set RMQ_PASS in the private environment file}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBIT_MANAGEMENT_PORT:-18072}:15672"
    networks: [data-net, management-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 8
  rabbitmq-init:
    image: rabbitmq:management-alpine
    user: rabbitmq
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASS:?Set RMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq:ro
      - ../Gateway/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq-init.sh:/bootstrap.sh:ro
    networks: [data-net]
    depends_on:
      rabbitmq: { condition: service_healthy }
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [data-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  user-service:
    build: ../UserService
    environment:
      Redis__ConnectionString: redis:6379
      Supabase__Url: ${SUPABASE_URL:?Set SUPABASE_URL}
      Supabase__PublishableKey: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY}
      Supabase__SecretKey: ${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY}
    networks: [data-net, public-net]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
  chat-gateway:
    build:
      context: ..
      dockerfile: Gateway/Dockerfile
    environment:
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RMQ_USER:-admin}
      RabbitMQ__Password: ${RMQ_PASS:?Set RMQ_PASS}
      Redis__ConnectionString: redis:6379
      Redis__PresenceKeyPrefix: "eva-chat:online:"
      Redis__SingleGatewayDeliveryChannel: "gateway:delivery"
      Supabase__Url: ${SUPABASE_URL}
      Supabase__PublishableKey: ${SUPABASE_PUBLISHABLE_KEY}
    networks: [public-net, data-net]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME:-eva-integration}_public-net
      - traefik.http.routers.eva-chat.rule=PathPrefix(`/`)
      - traefik.http.routers.eva-chat.entrypoints=eva-isolated
      - traefik.http.services.eva-chat.loadbalancer.server.port=8080
    depends_on:
      rabbitmq-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      user-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    stop_grace_period: 45s
  storage-worker:
    build:
      context: ..
      dockerfile: Storage-Service/Dockerfile
    environment:
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RMQ_USER:-admin}
      RabbitMQ__Password: ${RMQ_PASS:?Set RMQ_PASS}
      Storage__WorkerCount: ${STORAGE_WORKERS:-3}
      Supabase__Url: ${SUPABASE_URL}
      Supabase__SecretKey: ${SUPABASE_SECRET_KEY}
    networks: [data-net, egress-net]
    depends_on:
      rabbitmq-init: { condition: service_completed_successfully }
    stop_grace_period: 45s
  delivery-worker:
    build:
      context: ..
      dockerfile: Delivery-Service/Dockerfile
    environment:
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RMQ_USER:-admin}
      RabbitMQ__Password: ${RMQ_PASS:?Set RMQ_PASS}
      RabbitMQ__QueueName: delivery_queue
      Redis__ConnectionString: redis:6379
      Redis__PresenceKeyPrefix: "eva-chat:online:"
      Redis__SingleGatewayDeliveryChannel: "gateway:delivery"
      Delivery__WorkerCount: ${DELIVERY_WORKERS:-3}
    networks: [data-net]
    depends_on:
      rabbitmq-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    stop_grace_period: 45s
  frontend:
    build:
      context: ../Frontend/chat-app
      args:
        EXPO_PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost:18080}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18081}:80"
    networks: [public-net]
    depends_on:
      chat-gateway: { condition: service_healthy }

networks:
  public-net: {}
  data-net:
    internal: true
  management-net: {}
  egress-net: {}
volumes:
  rabbitmq_data: {}
  redis_data: {}
